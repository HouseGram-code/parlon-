[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parlon-bot"
version = "0.1.0"
description = "Official Python SDK for Parlon bots (api beta v0.1) — text messages and buttons."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Parlon" }]
keywords = ["parlon", "bot", "chatbot", "api", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "requests>=2.28",
]

[project.urls]
Homepage = "https://parlon-app.vercel.app"
"Developer Portal" = "https://parlon-developers.vercel.app"

[tool.setuptools.packages.find]
include = ["parlon_bot*"]
